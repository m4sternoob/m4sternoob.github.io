let loadedCount = 0;
const totalSprites = Object.keys(spriteFiles).length;

function loadSprites(callback) {
  for (const [name, path] of Object.entries(spriteFiles)) {
    const img = new Image();
    img.onload = () => {
      sprites[name] = img;
      loadedCount++;
      if (loadedCount === totalSprites) callback();
    };
    img.onerror = () => {
      console.error('Failed to load', path);
      loadedCount++;
      if (loadedCount === totalSprites) callback();
    };
    img.src = path;
  }
}

// --- Zombie frames (from tilesheet analysis) ---
// Tilesheet 720x330, Row 0: y=14-110 (h=96)
// Frames: x=0-75, 81-159, 160-240, 248-317 (walk cycle)
const ZOMBIE_FRAMES = [
  { x: 0, y: 14, w: 75, h: 96 },    // idle/walk 0
  { x: 81, y: 14, w: 78, h: 96 },   // walk 1
  { x: 160, y: 14, w: 80, h: 96 },  // walk 2
  { x: 248, y: 14, w: 69, h: 96 },  // walk 3
];

// --- Tile info (Kenney 70x70) ---
const TILE = 70;
// Grass-top dirt tile position in sheet (row with grass on top)
const GRASS_TILE = { cx: 2, cy: 8 };  // will verify visually
const DIRT_TILE = { cx: 2, cy: 9 };

// --- Game state ---
const STATE = { MENU: 0, PLAY: 1, GAMEOVER: 2 };
let gameState = STATE.MENU;

const planetFacts = [
  "The gravity on Earth is -9.81 m/s^2. Which is 100% of Earth",
  "The gravity on the Moon is -1.62 m/s^2. Which is 16.5% of Earth",
  "The gravity on Mars is -3.71 m/s^2. Which is 37.8% of Earth",
  "The gravity on Jupiter is -24.79 m/s^2. Which is 252.7% of Earth"
];
let factIndex = 0;

// Physics (scaled from Unity: moveSpeed=5, jumpForce=8)
const GRAVITY = 0.6;
const MOVE_SPEED = 4.5;
const JUMP_FORCE = -13;
const W = 800, H = 450;

// Player (zombie)
const player = {
  x: 400, y: 300, w: 52, h: 66,
  vx: 0, vy: 0,
  onGround: false, facing: 1,
  walkFrame: 0, walkTimer: 0,
  moving: false
};

// Ball
const ball = {
  x: 300, y: 200, r: 16,
  vx: 2.5, vy: 0
};

const platforms = [
  { x: 0, y: 400, w: 800, h: 50, type: 'ground' },
  { x: 0, y: 0, w: 30, h: 400, type: 'wall' },
  { x: 770, y: 0, w: 30, h: 400, type: 'wall' },
];

const spikes = [
  { x: 200, y: 388, w: 44, h: 12 },
  { x: 550, y: 388, w: 44, h: 12 }
];

const cactus = { x: 350, y: 348, w: 34, h: 52 };
const goal = { x: 700, y: 300, w: 60, h: 100 };

// Cheerleader spectator
const cheerleader = { x: 60, y: 320, w: 45, h: 95, bob: 0 };

// Halloween decorations
const bats = [
  { x: 100, y: 80, speed: 1.5, offset: 0 },
  { x: 500, y: 120, speed: 2, offset: 2 },
  { x: 700, y: 60, speed: 1.2, offset: 4 }
];
const ghost = { x: 650, y: 150, float: 0 };
const pumpkins = [
  { x: 130, y: 375 },
  { x: 660, y: 375 }
];

// Decorative plants (pixel-art style)
const plants = [
  { x: 100, y: 395, type: 'bush', s: 1 },
  { x: 250, y: 397, type: 'grass', s: 1 },
  { x: 450, y: 395, type: 'bush', s: 0.8 },
  { x: 600, y: 397, type: 'grass', s: 1.2 },
  { x: 730, y: 395, type: 'deadtree', s: 1 }
];

let score = 0, streak = 0;
const STREAK_TO_WIN = 3;

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (gameState === STATE.MENU && (e.key === 'Enter' || e.key === ' ')) startGame();
  if (gameState === STATE.GAMEOVER && (e.key === 'Enter' || e.key === ' ')) gameState = STATE.MENU;
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

let touchLeft = false, touchRight = false, touchJump = false;
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gameState === STATE.MENU) { startGame(); return; }
  if (gameState === STATE.GAMEOVER) { gameState = STATE.MENU; return; }
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const x = (t.clientX - rect.left) / rect.width * W;
  if (x < W * 0.33) touchLeft = true;
  else if (x < W * 0.66) touchJump = true;
  else touchRight = true;
});
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  touchLeft = touchRight = touchJump = false;
});

function startGame() {
  gameState = STATE.PLAY;
  score = 0; streak = 0;
  player.x = 400; player.y = 300; player.vx = 0; player.vy = 0;
  ball.x = 300; ball.y = 200; ball.vx = 2.5; ball.vy = 0;
  factIndex = Math.floor(Math.random() * planetFacts.length);
}

function resetBall() {
  ball.x = 300; ball.y = 200;
  ball.vx = (Math.random() > 0.5 ? 1 : -1) * 2.5;
  ball.vy = 0;
}

function update() {
  if (gameState !== STATE.PLAY) return;

  // Player movement (smooth)
  const left = keys['a'] || keys['arrowleft'] || touchLeft;
  const right = keys['d'] || keys['arrowright'] || touchRight;
  const jump = keys['w'] || keys['arrowup'] || keys[' '] || touchJump;

  player.moving = false;
  if (left) { player.vx = -MOVE_SPEED; player.facing = -1; player.moving = true; }
  else if (right) { player.vx = MOVE_SPEED; player.facing = 1; player.moving = true; }
  else { player.vx *= 0.8; } // smooth stop

  if (jump && player.onGround) {
    player.vy = JUMP_FORCE;
    player.onGround = false;
  }

  // Walk animation
  if (player.moving && player.onGround) {
    player.walkTimer += 1;
    if (player.walkTimer > 8) {
      player.walkTimer = 0;
      player.walkFrame = (player.walkFrame + 1) % ZOMBIE_FRAMES.length;
    }
  } else {
    player.walkFrame = 0;
  }

  // Physics
  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  player.onGround = false;
  for (const p of platforms) {
    if (player.x < p.x + p.w && player.x + player.w > p.x &&
        player.y < p.y + p.h && player.y + player.h > p.y) {
      if (player.vy > 0 && player.y + player.h - player.vy <= p.y + 5) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h; player.vy = 0;
      } else {
        if (player.vx > 0) player.x = p.x - player.w;
        else if (player.vx < 0) player.x = p.x + p.w;
      }
    }
  }
  player.x = Math.max(30, Math.min(W - 30 - player.w, player.x));

  // Ball physics
  ball.vy += GRAVITY * 0.7;
  ball.x += ball.vx;
  ball.y += ball.vy;

  for (const p of platforms) {
    if (ball.x + ball.r > p.x && ball.x - ball.r < p.x + p.w &&
        ball.y + ball.r > p.y && ball.y - ball.r < p.y + p.h) {
      if (ball.y < p.y + p.h / 2) {
        ball.y = p.y - ball.r;
        ball.vy = -Math.abs(ball.vy) * 0.82;
        if (Math.abs(ball.vy) < 2) ball.vy = -4;
      } else {
        ball.y = p.y + p.h + ball.r;
        ball.vy = Math.abs(ball.vy) * 0.82;
      }
      if (ball.x < p.x + p.w / 2) { ball.x = p.x - ball.r; ball.vx = -Math.abs(ball.vx) * 0.95; }
      else { ball.x = p.x + p.w + ball.r; ball.vx = Math.abs(ball.vx) * 0.95; }
    }
  }

  // Ball-player collision
  if (ball.x + ball.r > player.x && ball.x - ball.r < player.x + player.w &&
      ball.y + ball.r > player.y && ball.y - ball.r < player.y + player.h) {
    const hitX = (ball.x - (player.x + player.w / 2)) / (player.w / 2);
    ball.vx = hitX * 6 + player.vx * 0.8;
    ball.vy = -9;
    ball.y = player.y - ball.r;
  }

  // Spikes
  for (const s of spikes) {
    if (ball.x + ball.r > s.x && ball.x - ball.r < s.x + s.w &&
        ball.y + ball.r > s.y && ball.y - ball.r < s.y + s.h) {
      streak = 0; resetBall(); break;
    }
  }

  // Goal
  if (ball.x > goal.x && ball.x < goal.x + goal.w &&
      ball.y > goal.y && ball.y < goal.y + goal.h) {
    score++; streak++;
    factIndex = (factIndex + 1) % planetFacts.length;
    if (streak >= STREAK_TO_WIN) gameState = STATE.GAMEOVER;
    else resetBall();
  }

  if (ball.y > H + 50) { streak = 0; resetBall(); }

  // Player fell off - respawn
  if (player.y > H + 50) {
    player.x = 400; player.y = 300; player.vx = 0; player.vy = 0;
    streak = 0;
  }

  // Cheerleader bobbing
  cheerleader.bob += 0.15;

  // Halloween animations
  ghost.float += 0.05;
  for (const b of bats) {
    b.x -= b.speed;
    b.offset += 0.2;
    if (b.x < -30) b.x = W + 30;
  }
}

function drawZombie(x, y, w, h, facing, frame) {
  if (!sprites.zombie) {
    ctx.fillStyle = '#4CAF50'; ctx.fillRect(x, y, w, h); return;
  }
  const f = ZOMBIE_FRAMES[frame % ZOMBIE_FRAMES.length];
  ctx.save();
  if (facing < 0) {
    ctx.translate(x + w / 2, 0);
    ctx.scale(-1, 1);
    ctx.translate(-(x + w / 2), 0);
  }
  ctx.drawImage(sprites.zombie, f.x, f.y, f.w, f.h, x, y, w, h);
  ctx.restore();
}

function drawTile(tx, ty, cx, cy) {
  if (!sprites.tiles) return;
  ctx.drawImage(sprites.tiles, cx * TILE, cy * TILE, TILE, TILE, tx, ty, TILE, TILE);
}

// --- Halloween drawing ---
function drawMoon(x, y, r) {
  ctx.fillStyle = '#F5F5DC';
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.beginPath(); ctx.arc(x - r*0.3, y - r*0.2, r*0.25, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + r*0.2, y + r*0.3, r*0.18, 0, Math.PI * 2); ctx.fill();
}

function drawPumpkin(x, y, s) {
  // s = size
  ctx.fillStyle = '#FF6B00';
  ctx.beginPath(); ctx.ellipse(x, y, s, s*0.85, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#E55A00';
  ctx.beginPath(); ctx.ellipse(x - s*0.3, y, s*0.25, s*0.7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + s*0.3, y, s*0.25, s*0.7, 0, 0, Math.PI * 2); ctx.fill();
  // Stem
  ctx.fillStyle = '#4A7C00';
  ctx.fillRect(x - 3, y - s*0.85 - 8, 6, 10);
  // Glowing face
  ctx.fillStyle = '#FFE135';
  // Eyes (triangles)
  ctx.beginPath();
  ctx.moveTo(x - s*0.45, y - s*0.2); ctx.lineTo(x - s*0.15, y - s*0.2); ctx.lineTo(x - s*0.3, y + s*0.05);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + s*0.15, y - s*0.2); ctx.lineTo(x + s*0.45, y - s*0.2); ctx.lineTo(x + s*0.3, y + s*0.05);
  ctx.fill();
  // Mouth (jagged smile)
  ctx.beginPath();
  ctx.moveTo(x - s*0.5, y + s*0.3);
  ctx.lineTo(x - s*0.25, y + s*0.45); ctx.lineTo(x, y + s*0.3);
  ctx.lineTo(x + s*0.25, y + s*0.45); ctx.lineTo(x + s*0.5, y + s*0.3);
  ctx.lineTo(x + s*0.25, y + s*0.35); ctx.lineTo(x, y + s*0.5);
  ctx.lineTo(x - s*0.25, y + s*0.35);
  ctx.closePath(); ctx.fill();
}

function drawGhost(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(x, y - s*0.3, s*0.5, Math.PI, 0);
  ctx.lineTo(x + s*0.5, y + s*0.4);
  // Wavy bottom
  for (let i = 0; i < 3; i++) {
    const wx = x + s*0.5 - (i + 0.5) * (s / 3);
    ctx.quadraticCurveTo(wx + s/6, y + s*0.6, wx, y + s*0.4);
  }
  ctx.lineTo(x - s*0.5, y - s*0.3);
  ctx.fill();
  // Eyes
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x - s*0.18, y - s*0.25, s*0.08, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + s*0.18, y - s*0.25, s*0.08, 0, Math.PI * 2); ctx.fill();
  // Mouth (ooh)
  ctx.beginPath(); ctx.ellipse(x, y - s*0.05, s*0.07, s*0.1, 0, 0, Math.PI * 2); ctx.fill();
}

function drawBat(x, y, s, flap) {
  ctx.fillStyle = '#1a1a1a';
  const wingY = Math.sin(flap) * s * 0.4;
  // Body
  ctx.beginPath(); ctx.ellipse(x, y, s*0.25, s*0.35, 0, 0, Math.PI * 2); ctx.fill();
  // Wings
  ctx.beginPath();
  ctx.moveTo(x - s*0.2, y);
  ctx.quadraticCurveTo(x - s*0.8, y - s*0.5 + wingY, x - s, y + wingY);
  ctx.quadraticCurveTo(x - s*0.6, y + s*0.2, x - s*0.2, y + s*0.1);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + s*0.2, y);
  ctx.quadraticCurveTo(x + s*0.8, y - s*0.5 + wingY, x + s, y + wingY);
  ctx.quadraticCurveTo(x + s*0.6, y + s*0.2, x + s*0.2, y + s*0.1);
  ctx.fill();
  // Ears
  ctx.beginPath();
  ctx.moveTo(x - s*0.15, y - s*0.3); ctx.lineTo(x - s*0.1, y - s*0.5); ctx.lineTo(x - s*0.02, y - s*0.3);
  ctx.moveTo(x + s*0.15, y - s*0.3); ctx.lineTo(x + s*0.1, y - s*0.5); ctx.lineTo(x + s*0.02, y - s*0.3);
  ctx.fill();
}

// --- Plant decorations (pixel-art style) ---
function drawBush(x, y, s) {
  ctx.fillStyle = '#1a5c1a';
  ctx.beginPath(); ctx.arc(x, y - 8*s, 12*s, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x - 10*s, y - 4*s, 8*s, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 10*s, y - 4*s, 8*s, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a7c2a';
  ctx.beginPath(); ctx.arc(x - 4*s, y - 10*s, 5*s, 0, Math.PI * 2); ctx.fill();
}

function drawGrassTuft(x, y, s) {
  ctx.fillStyle = '#2a7c2a';
  for (let i = -2; i <= 2; i++) {
    const h = (8 + Math.abs(i) * 2) * s;
    ctx.fillRect(x + i * 4 * s, y - h, 3 * s, h);
  }
}

function drawDeadTree(x, y, s) {
  ctx.strokeStyle = '#3a2a1a'; ctx.lineWidth = 4 * s;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y - 40*s); ctx.stroke();
  ctx.lineWidth = 2.5 * s;
  ctx.beginPath(); ctx.moveTo(x, y - 25*s); ctx.lineTo(x - 15*s, y - 40*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - 30*s); ctx.lineTo(x + 14*s, y - 45*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - 40*s); ctx.lineTo(x - 5*s, y - 55*s); ctx.stroke();
}

function draw() {
  // Halloween night sky (dark purple-blue gradient)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#0d0d2b');
  skyGrad.addColorStop(0.7, '#1a1a3e');
  skyGrad.addColorStop(1, '#2d1b4e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Stars
  ctx.fillStyle = '#FFF';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 137) % W, sy = (i * 89) % 200;
    ctx.globalAlpha = 0.3 + (i % 3) * 0.2;
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;

  if (gameState === STATE.MENU) { drawMenu(); return; }

  // Full moon
  drawMoon(680, 80, 45);

  // Bats
  for (const b of bats) drawBat(b.x, b.y + Math.sin(b.offset) * 10, 18, b.offset);

  // Ghost floating
  drawGhost(ghost.x, ghost.y + Math.sin(ghost.float) * 15, 40);

  // Ground - solid, no gaps (matches video: green grass over brown dirt)
  const groundY = 400;
  ctx.fillStyle = '#8B6914'; ctx.fillRect(0, groundY, W, 50);
  ctx.fillStyle = '#4CAF50'; ctx.fillRect(0, groundY, W, 14);
  // Grass tufts for texture
  ctx.fillStyle = '#45a049';
  for (let x = 0; x < W; x += 18) {
    ctx.fillRect(x, groundY - 3, 5, 6);
  }

  // Walls
  ctx.fillStyle = '#8B6914';
  ctx.fillRect(0, 0, 30, 400);
  ctx.fillRect(770, 0, 30, 400);

  // Spikes (use real sprite if loaded)
  if (sprites.spikes) {
    for (const s of spikes) {
      ctx.drawImage(sprites.spikes, s.x, s.y - 8, s.w + 20, s.h + 12);
    }
  } else {
    ctx.fillStyle = '#DDD';
    for (const s of spikes) {
      for (let x = s.x; x < s.x + s.w; x += 10) {
        ctx.beginPath();
        ctx.moveTo(x, s.y + s.h); ctx.lineTo(x + 5, s.y); ctx.lineTo(x + 10, s.y + s.h);
        ctx.fill();
      }
    }
  }

  // Cactus (green)
  ctx.fillStyle = '#4CAF50';
  ctx.fillRect(cactus.x, cactus.y, cactus.w, cactus.h);

  // Goal
  ctx.strokeStyle = '#FFF'; ctx.lineWidth = 4;
  ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(goal.x, goal.y, goal.w, goal.h);

  // Ball
  const grad = ctx.createRadialGradient(ball.x - 5, ball.y - 5, 2, ball.x, ball.y, ball.r);
  grad.addColorStop(0, '#FFFFFF'); grad.addColorStop(1, '#CCCCCC');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();

  // Player (REAL zombie sprite)
  drawZombie(player.x, player.y, player.w, player.h, player.facing, player.walkFrame);

  // Cheerleader spectator (bobbing)
  if (sprites.cheerleader) {
    const bobY = Math.sin(cheerleader.bob) * 6;
    ctx.drawImage(sprites.cheerleader, cheerleader.x, cheerleader.y + bobY, cheerleader.w, cheerleader.h);
  }

  // Halloween pumpkins on the ground
  for (const p of pumpkins) drawPumpkin(p.x, p.y, 18);

  // Decorative plants
  for (const pl of plants) {
    if (pl.type === 'bush') drawBush(pl.x, pl.y, pl.s);
    else if (pl.type === 'grass') drawGrassTuft(pl.x, pl.y, pl.s);
    else if (pl.type === 'deadtree') drawDeadTree(pl.x, pl.y, pl.s);
  }

  // HUD
  ctx.fillStyle = '#4CAF50';
  ctx.font = 'bold 28px Arial'; ctx.textAlign = 'left';
  ctx.fillText('Score : ' + score, 20, 50);
  ctx.fillStyle = '#FFF'; ctx.font = '20px Arial';
  ctx.fillText('Streak: ' + streak + '/' + STREAK_TO_WIN, 20, 80);
  ctx.font = '16px Arial'; ctx.textAlign = 'center';
  ctx.fillText(planetFacts[factIndex], W / 2, 30);

  if (gameState === STATE.GAMEOVER) drawGameOver();
}

function drawMenu() {
  ctx.fillStyle = '#4CAF50'; ctx.font = 'bold 64px Arial'; ctx.textAlign = 'center';
  ctx.fillText('HAT TRICK', W/2, 150);
  ctx.fillStyle = '#888'; ctx.font = '20px Arial';
  ctx.fillText('by m4ster', W/2, 185);

  // Show zombie sprite on menu
  if (sprites.zombie) drawZombie(W/2 - 26, 210, 52, 66, 1, 0);

  ctx.fillStyle = '#FFF'; ctx.font = '24px Arial';
  ctx.fillText('Score 3 goals in a row to win!', W/2, 310);
  ctx.fillText('Move: A/D or Arrows  |  Jump: Space/W', W/2, 340);
  ctx.fillStyle = '#4CAF50'; ctx.font = 'bold 28px Arial';
  ctx.fillText('Press ENTER or TAP to Start', W/2, 390);
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#4CAF50'; ctx.font = 'bold 56px Arial'; ctx.textAlign = 'center';
  ctx.fillText('HAT TRICK!', W/2, 180);
  ctx.fillStyle = '#FFF'; ctx.font = '28px Arial';
  ctx.fillText('You scored 3 in a row!', W/2, 230);
  ctx.fillText('Final Score: ' + score, W/2, 270);
  ctx.fillStyle = '#888'; ctx.font = '20px Arial';
  ctx.fillText('Press ENTER or TAP for Menu', W/2, 330);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

loadSprites(() => {
  loadingEl.style.display = 'none';
  canvas.style.display = 'block';
  loop();
});
</script>
